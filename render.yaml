services:
  - type: web
    name: torchcoin
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: torchcoin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: torchcoin-db
