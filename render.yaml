services:
  - type: web
    name: torchcoin
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: torchcoin-db-recovery
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RECOVERY_SIGNING_SECRET
        generateValue: true

databases:
  - name: torchcoin-db-recovery
    databaseName: torchcoin_db_recovery
    user: torchcoin_db_user
    plan: free
    region: oregon
